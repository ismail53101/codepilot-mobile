name: flutter-build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - uses: android-actions/setup-android@v3
      - run: flutter create . --org com.codepilot --project-name codepilot_mobile
      - name: Configure Android build compatibility
        run: |
          # Current Flutter plugins require Android SDK 35 and Kotlin 1.9+.
          # AGP 8.6/Gradle 8.7 use an aapt2 version that understands SDK 35.
          sed -i '/com.android.application/c\    id "com.android.application" version "8.6.1" apply false' android/settings.gradle
          sed -i '/org.jetbrains.kotlin.android/c\    id "org.jetbrains.kotlin.android" version "1.9.25" apply false' android/settings.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle
          sed -i 's/buildToolsVersion = flutter.buildToolsVersion/buildToolsVersion = "35.0.0"/' android/app/build.gradle
          sed -i 's/buildToolsVersion flutter.buildToolsVersion/buildToolsVersion "35.0.0"/' android/app/build.gradle
      - name: Install Android SDK 35 toolchain
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --uninstall "platforms;android-35" || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
