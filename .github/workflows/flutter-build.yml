name: flutter-build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - run: flutter create . --org com.codepilot --project-name codepilot_mobile
      - name: Apply CodeFexa Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/values
          cp assets/codefexa_logo.png android/app/src/main/res/drawable/codefexa_logo.png
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/codefexa_logo.png "android/app/src/main/res/mipmap-$density/ic_launcher.png"; done
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/codefexa_icon_background" />
              <foreground android:drawable="@drawable/codefexa_logo" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/values/codefexa_colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="codefexa_icon_background">#07111F</color></resources>
          EOF
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:drawable="@android:color/black" />
              <item>
                  <bitmap android:gravity="center" android:src="@drawable/codefexa_logo" />
              </item>
          </layer-list>
          EOF
          mkdir -p android/app/src/main/res/drawable-v21
          cp android/app/src/main/res/drawable/launch_background.xml android/app/src/main/res/drawable-v21/launch_background.xml
          sed -i 's/android:label="codepilot_mobile"/android:label="CodeFexa Mobile"/' android/app/src/main/AndroidManifest.xml
      - name: Configure Android build compatibility
        run: |
          # Current Flutter plugins require Android SDK 35 and Kotlin 1.9+.
          # AGP 8.6/Gradle 8.7 use an aapt2 version that understands SDK 35.
          sed -i '/com.android.application/c\    id "com.android.application" version "8.6.1" apply false' android/settings.gradle
          sed -i '/org.jetbrains.kotlin.android/c\    id "org.jetbrains.kotlin.android" version "1.9.25" apply false' android/settings.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 35/' android/app/build.gradle
          sed -i 's/buildToolsVersion = flutter.buildToolsVersion/buildToolsVersion = "35.0.0"/' android/app/build.gradle
          sed -i 's/buildToolsVersion flutter.buildToolsVersion/buildToolsVersion "35.0.0"/' android/app/build.gradle
          # INTERNET permission in the MAIN manifest (debug manifests have it
          # by default; release APKs would lose device flow + API access).
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Plugins (file_picker, secure_storage, share_plus, …) require NDK
          # 26.x; the template pins an older one. NDK is backward compatible.
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "26.1.10909125"/' android/app/build.gradle
          sed -i 's/ndkVersion flutter.ndkVersion/ndkVersion "26.1.10909125"/' android/app/build.gradle
      # Google Play upload signing: decode the keystore from the
      # KEYSTORE_BASE64 secret and write android/key.properties for Gradle.
      # Without these secrets, the release artifact job fails explicitly
      # instead of publishing a misleading debug-signed release.
      - name: Decode upload keystore (if repository secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "KEYSTORE_SET=true" >> "$GITHUB_ENV"
            echo "Upload keystore configured — release builds will be signed with it."
          else
            echo "KEYSTORE_BASE64 not set — release artifact build will fail with a clear signing error."
          fi
      # key.properties alone is not enough because android/ is regenerated
      # every run: patch the generated app/build.gradle to add the signing
      # config and use it for release builds.
      - name: Wire upload-keystore signing into Gradle (when key.properties exists)
        run: |
          if [ -f android/key.properties ]; then
            grep -q keystorePropertiesFile android/app/build.gradle || sed -i '0,/^android {/s//def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\nandroid {/' android/app/build.gradle
            grep -q 'upload {' android/app/build.gradle || sed -i '0,/^android {$/s//android {\n    signingConfigs {\n        if (keystorePropertiesFile.exists()) {\n            upload {\n                keyAlias keystoreProperties["keyAlias"]\n                keyPassword keystoreProperties["keyPassword"]\n                storeFile file(keystoreProperties["storeFile"])\n                storePassword keystoreProperties["storePassword"]\n            }\n        }\n    }/' android/app/build.gradle
            sed -i 's/signingConfig = signingConfigs.debug/signingConfig = keystorePropertiesFile.exists() ? signingConfigs.upload : signingConfigs.debug/' android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig = keystorePropertiesFile.exists() ? signingConfigs.upload : signingConfigs.debug/' android/app/build.gradle
            echo "Gradle release signing: upload keystore."
          else
            echo "No key.properties — release signing verification will fail."
          fi
      - name: Install Android SDK 35 toolchain
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --uninstall "platforms;android-35" || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Release artifacts must be signed with the configured upload keystore.
      # Fail explicitly when it is unavailable instead of publishing a
      # misleading debug-signed release artifact.
      - name: Verify release signing configuration
        run: |
          if [ "${KEYSTORE_SET:-false}" != "true" ]; then
            echo "::error::Release signing is unavailable. Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD repository secrets before building Android-APK and Android-AAB."
            exit 1
          fi
      - name: Build release APK
        run: |
          ARGS=""
          if [ -n "$RESEND_API_KEY" ]; then
            ARGS="--dart-define=RESEND_API_KEY=$RESEND_API_KEY"
          fi
          flutter build apk --release $ARGS
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Build release App Bundle
        run: |
          ARGS=""
          if [ -n "$RESEND_API_KEY" ]; then
            ARGS="--dart-define=RESEND_API_KEY=$RESEND_API_KEY"
          fi
          flutter build appbundle --release $ARGS
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: build/app/outputs/bundle/release/app-release.aab
