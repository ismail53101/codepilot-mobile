name: Build CodePilot Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repository keeps only selected Android resources; regenerate the
      # platform project with the current Flutter toolchain so the build uses
      # the supported Android v2 embedding instead of deleted v1 APIs.
      - name: Generate Android v2 project
        run: flutter create . --org com.codepilot --project-name codepilot_mobile

      - name: Configure Android API 36
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          # Newer Flutter generates the Kotlin-DSL build.gradle.kts; older
          # ones generate Groovy build.gradle. Patch whichever exists so the
          # step can never fail with "can't read build.gradle" again.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle
            sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' android/app/build.gradle
          fi
          # Plugin subprojects pin literal compileSdk values (often 34/35).
          # Newer plugin AARs declare minCompileSdk 36, which then fails the
          # AAR metadata check (":file_picker is currently compiled against
          # android-34"). Raise the literal pins to 36; plugins that use
          # flutter.compileSdkVersion already resolve to 36 on this Flutter.
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" \( -name build.gradle -o -name build.gradle.kts \) \
            -path "*android*" -type f 2>/dev/null | while read -r f; do
              case "$f" in
              *build.gradle.kts)
                sed -i -E 's/compileSdk ?= ?[0-9]+/compileSdk = 36/' "$f" ;;
              *)
                sed -i -E 's/compileSdkVersion ?= ?[0-9]+/compileSdkVersion = 36/
                            s/compileSdkVersion [0-9]+/compileSdkVersion 36/
                            s/compileSdk ?= ?[0-9]+/compileSdk = 36/
                            s/compileSdk [0-9]+/compileSdk 36/' "$f" ;;
              esac
            done

      - name: Apply CodeFexa Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/codefexa_logo.png android/app/src/main/res/drawable/codefexa_logo.png
          sed -i 's/android:label="codepilot_mobile"/android:label="CodeFexa Mobile"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/codefexa_logo"#' android/app/src/main/AndroidManifest.xml || true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          # Signing is optional: without repository secrets the build falls
          # back to debug signing (fine for sideloading) instead of failing.
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret — building debug-signed APK."
          fi

      - name: Create key.properties
        run: |
          if [ ! -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Skipping key.properties (no signing secrets)."
            exit 0
          fi
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-mobile-release
          path: build/app/outputs/flutter-apk/app-release.apk
