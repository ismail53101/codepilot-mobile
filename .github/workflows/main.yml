name: Build CodePilot Mobile

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # The repository keeps only selected Android resources; regenerate the
      # platform project with the current Flutter toolchain so the build uses
      # the supported Android v2 embedding instead of deleted v1 APIs.
      - name: Generate Android v2 project
        run: flutter create . --org com.codepilot --project-name codepilot_mobile

      - name: Apply CodeFexa Android branding
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp assets/codefexa_logo.png android/app/src/main/res/drawable/codefexa_logo.png
          sed -i 's/android:label="codepilot_mobile"/android:label="CodeFexa Mobile"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/codefexa_logo"#' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Decode Android keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-mobile-release
          path: build/app/outputs/flutter-apk/app-release.apk
