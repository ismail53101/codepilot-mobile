name: codepilot_mobile
description: CodePilot Mobile — an AI coding agent for Android that works on your own OpenAI-compatible API and your own project ZIPs.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^3.4.10          # ZIP import / export
  file_picker: ^8.0.3       # pick ZIP from Android storage
  flutter_secure_storage: ^9.2.2  # API key at rest (Keystore-backed)
  http: ^1.2.1              # OpenAI-compatible client with SSE streaming
  path_provider: ^2.1.3     # local project workspace
  shared_preferences: ^2.2.3  # non-secret settings
  share_plus: ^9.0.0        # share exported ZIP
  cross_file: ^0.3.4+2       # shared file type for share_plus
  path: ^1.9.0
  url_launcher: ^6.3.0     # GitHub OAuth device verification page
  webview_flutter: ^4.7.0   # live HTML preview of generated code

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
